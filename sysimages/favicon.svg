<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Flag pole -->
  <rect x="15.5" y="0" width="1" height="5" fill="#880e4f"/>
  <!-- Pennant flag -->
  <polygon points="16.5,0.5 22,3 16.5,5" fill="#ad1457"/>
  <!-- Tent roof (main triangle) -->
  <polygon points="16,4 30,16 2,16" fill="#e91e63"/>
  <!-- Roof right-side shading for depth -->
  <polygon points="16,4 30,16 22,16" fill="#c2185b" opacity="0.28"/>
  <!-- Roof left highlight -->
  <polygon points="16,4 10,16 14,16" fill="#ffffff" opacity="0.10"/>
  <!-- Tent body walls -->
  <rect x="3" y="16" width="26" height="11" rx="2" fill="#fce4ec"/>
  <!-- Left window -->
  <rect x="5" y="19" width="5" height="4" rx="1" fill="#f48fb1"/>
  <!-- Right window -->
  <rect x="22" y="19" width="5" height="4" rx="1" fill="#f48fb1"/>
  <!-- Door arch (centered) -->
  <path d="M13,27 L13,21.5 Q16,18.5 19,21.5 L19,27 Z" fill="#e91e63"/>
  <!-- Roof scallop border (decorative bottom edge) -->
  <path d="M2,16 Q4,18 6,16 Q8,18 10,16 Q12,18 14,16 Q16,18 18,16 Q20,18 22,16 Q24,18 26,16 Q28,18 30,16" stroke="#c2185b" stroke-width="1.2" fill="none" opacity="0.6"/>
</svg>
