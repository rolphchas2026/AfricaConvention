services:
  shared-db:
    image: postgres:15-alpine
    container_name: shared-db
    environment:
      POSTGRES_DB: africa_convention
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ArushaPassword2026
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - convention-network
    restart: unless-stopped

  alfio:
    image: openjdk:11-jre-slim
    container_name: alfio-app
    depends_on:
      - shared-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shared-db:5432/africa_convention
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ArushaPassword2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "9090:8080"
    networks:
      - convention-network
    restart: unless-stopped

  qr-api:
    build:
      context: .
      dockerfile: Dockerfile.qr
    container_name: qr-checkin-api
    depends_on:
      - shared-db
    environment:
      DB_HOST: shared-db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: ArushaPassword2026
      DB_NAME: africa_convention
      NODE_ENV: production
      PORT: 3000
      ADMIN_KEY: africa_convention_2026_secret_key
      ALFIO_VERIFICATION: "true"
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-pk_test_default}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_default}
    ports:
      - "3000:3000"
    networks:
      - convention-network
    restart: unless-stopped
    depends_on:
      - shared-db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.qr
    container_name: supervisor-dashboard
    environment:
      NODE_ENV: production
      PORT: 4000
      REACT_APP_API_URL: http://localhost:3000
    ports:
      - "4000:4000"
    networks:
      - convention-network
    restart: unless-stopped
    depends_on:
      - qr-api

  nginx:
    image: nginx:alpine
    container_name: convention_reverse_proxy
    depends_on:
      - alfio
      - qr-api
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - convention-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  convention-network:
    driver: bridge
